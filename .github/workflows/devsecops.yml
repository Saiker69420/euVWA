name: DevSecOps Pipeline

# Se ejecuta al hacer push en estas ramas
on:
  push:
    branches: [ "main-vulnerable", "main-secure" ]

jobs:
  # 1. Análisis Estático de Código (SAST)
  sast_semgrep:
    name: Análisis SAST con Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ejecutar Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: "p/security-audit"
          # El pipeline fallará si encuentra vulnerabilidades críticas

  # 2. Análisis de Dependencias (SCA) y Generación de SBOM
  sca_and_sbom:
    name: Análisis SCA y SBOM con Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'cyclonedx'
          output: 'sbom.json'
      
      - name: Guardar SBOM como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SBOM-CycloneDX
          path: sbom.json

      - name: Escaneo de Vulnerabilidades en Dependencias
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          severity: 'CRITICAL,HIGH'
          # exit-code: 1 hace que el pipeline falle si hay vulnerabilidades Altas/Críticas
          exit-code: '1'

  # 3. Construcción y Escaneo de Imagen Docker
  docker_security:
    name: Docker Build & Scan
    runs-on: ubuntu-latest
    needs: [sast_semgrep, sca_and_sbom] # Espera a que pasen las pruebas anteriores
    steps:
      - uses: actions/checkout@v4
      
      - name: Construir Imagen Docker localmente
        run: docker build -t mi-app-segura:latest .

      - name: Escaneo de la Imagen Docker con Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'mi-app-segura:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  # 4. Análisis Dinámico (DAST)
  dast_zap:
    name: Análisis DAST con OWASP ZAP
    runs-on: ubuntu-latest
    needs: [docker_security]
    steps:
      - uses: actions/checkout@v4
      
      # Levantamos la aplicación con Docker Compose para atacarla
      - name: Levantar aplicación local
        run: |
          docker-compose up -d
          sleep 10 # Damos tiempo a que arranque el servidor
          
      - name: Escaneo ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:3000'
          fail_action: false # Lo ponemos en false para que genere el reporte aunque encuentre fallos